<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 165" width="96" height="96" role="img" aria-label="the hiccup monster">
  <!-- the hiccup.monster mascot: a big friendly monster who fixes hiccups.
       flat colors, no gradients — matches the rest of the brand. -->
  <ellipse cx="80" cy="147" rx="44" ry="7" fill="#000" opacity="0.15"/>

  <!-- horns -->
  <path d="M54 42 L48 14 L68 38 Z" fill="#f5a623"/>
  <path d="M106 42 L112 14 L92 38 Z" fill="#f5a623"/>

  <!-- body -->
  <rect x="24" y="40" width="112" height="96" rx="40" fill="#ffc857"/>

  <!-- fuzzy spots -->
  <circle cx="40" cy="104" r="5" fill="#f0a83a" opacity="0.6"/>
  <circle cx="119" cy="60" r="4" fill="#f0a83a" opacity="0.6"/>
  <circle cx="114" cy="122" r="3.5" fill="#f0a83a" opacity="0.6"/>

  <!-- raised arm, holding up a "fixed" badge -->
  <path d="M120 96 Q142 90 146 70" stroke="#e3993a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="146" cy="56" r="15" fill="#3fb950" stroke="#1b1f24" stroke-width="2"/>
  <path d="M138 57 L144 63 L156 49" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- eyes: two on purpose, deliberately mismatched -->
  <circle cx="64" cy="80" r="13" fill="#fff"/>
  <circle cx="67" cy="83" r="6" fill="#1b1f24"/>
  <circle cx="69" cy="80" r="2" fill="#fff"/>

  <circle cx="99" cy="84" r="10" fill="#fff"/>
  <circle cx="101.5" cy="86.5" r="4.5" fill="#1b1f24"/>
  <circle cx="103" cy="84" r="1.6" fill="#fff"/>

  <!-- smile -->
  <path d="M56 104 Q80 126 104 102" stroke="#1b1f24" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
