<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hiccup — feedback</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('hiccup-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" href="/brand/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/hiccup.css">
<link rel="stylesheet" href="/app.css">
<style>
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar-spacer { flex: 1 1 auto; }
  .logo { font-size: 20px; font-weight: 700; color: var(--text); }
  .logo:hover { text-decoration: none; }
  .logo-bump { position: relative; top: -3px; display: inline-block; color: var(--accent); }
</style>
</head>
<!--
  hiccup — admin feedback viewer (ARCHITECTURE.md "Wave 6").

  The PAGE is served to any signed-in user; every /api/admin/* call it makes is
  separately gated by requireSiteAdmin() in server.js. So a non-admin who guesses
  this URL gets an empty shell and a 403, not a leak. The gate is the API's, not
  this file's — never rely on a page being "hidden" as an access control.
-->
<body>

<header class="topbar">
  <a class="logo" href="/app" aria-label="hiccup">hic<span class="logo-bump">c</span>up</a>
  <nav class="topnav" aria-label="tools">
    <a class="topnav-link" href="/app">workbench</a>
    <a class="topnav-link" href="/hmr">HMR</a>
    <a class="topnav-link" href="/kb">guides</a>
    <a class="topnav-link" href="/team">team</a>
  </nav>
  <span class="topbar-spacer"></span>
  <button class="btn theme-toggle icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">☀</button>
</header>

<main class="fb-admin">
  <div class="fb-admin-head">
    <div>
      <h1>Feedback</h1>
      <p class="muted" id="fb-summary">loading…</p>
    </div>
  </div>

  <div class="fb-toolbar">
    <label><input type="checkbox" id="fb-unread-only"> unread only</label>
    <span class="topbar-spacer"></span>
    <button class="btn" id="fb-digest-dry" type="button">preview digest</button>
    <button class="btn" id="fb-digest-send" type="button">send digest now</button>
  </div>

  <p id="fb-msg" class="feedback-msg" role="status" aria-live="polite"></p>
  <div id="fb-list"></div>
</main>

<script>
(function () {
  'use strict';

  var state = { items: [], unreadOnly: false };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function say(text, isErr) {
    var m = $('fb-msg');
    m.textContent = text || '';
    m.className = 'feedback-msg' + (isErr ? ' is-err' : '');
  }

  function when(ts) {
    try { return new Date(ts).toLocaleString(); } catch (e) { return String(ts); }
  }

  function render() {
    var host = $('fb-list');
    host.textContent = '';
    var items = state.unreadOnly ? state.items.filter(function (r) { return !r.read; }) : state.items;

    if (!items.length) {
      host.appendChild(el('p', 'fb-empty', state.items.length
        ? 'Nothing unread.'
        : 'No feedback yet. It will appear here as users send it.'));
      return;
    }

    items.forEach(function (r) {
      var card = el('div', 'fb-item ' + (r.read ? 'is-read' : 'is-unread'));

      var head = el('div', 'fb-item-head');
      head.appendChild(el('span', 'fb-kind', r.kind + (r.rating ? ' · ' + r.rating + '/5' : '')));
      head.appendChild(el('span', 'fb-when', when(r.ts)));
      head.appendChild(el('span', 'fb-who', r.email || r.userId || 'unknown'));
      var spacer = el('span', 'topbar-spacer');
      head.appendChild(spacer);
      var toggle = el('button', 'btn', r.read ? 'mark unread' : 'mark read');
      toggle.type = 'button';
      toggle.addEventListener('click', function () { setRead(r, !r.read); });
      head.appendChild(toggle);
      card.appendChild(head);

      card.appendChild(el('p', 'fb-comment', r.comment));

      if (r.context) {
        card.appendChild(el('pre', 'fb-context mono', JSON.stringify(r.context, null, 2)));
      } else {
        card.appendChild(el('p', 'fb-empty', 'no context attached'));
      }
      host.appendChild(card);
    });
  }

  async function setRead(rec, read) {
    try {
      var r = await fetch('/api/admin/feedback/' + encodeURIComponent(rec.id) + '/read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ read: read })
      });
      if (!r.ok) { say('could not update that item', true); return; }
      rec.read = read;
      summarise();
      render();
    } catch (e) { say('could not reach the server', true); }
  }

  function summarise() {
    var unread = state.items.filter(function (r) { return !r.read; }).length;
    $('fb-summary').textContent = state.items.length + ' total · ' + unread + ' unread' +
      (state.mailConfigured === false ? ' · email not configured (digest disabled)' : '');
  }

  async function digest(dry) {
    say(dry ? 'building preview…' : 'sending…');
    try {
      var r = await fetch('/api/admin/feedback/digest/send' + (dry ? '?dry=1' : ''), { method: 'POST' });
      var d = await r.json();
      if (!r.ok || d.ok === false) { say(d.error || 'digest failed', true); return; }
      if (d.skipped) { say('nothing to send: ' + d.skipped); return; }
      say(dry
        ? ('preview: "' + d.subject + '" → ' + d.to + ' (' + d.count + ' items)')
        : ('sent ' + d.count + ' items to ' + d.to));
    } catch (e) { say('could not reach the server', true); }
  }

  async function load() {
    try {
      var r = await fetch('/api/admin/feedback');
      if (r.status === 403) {
        $('fb-summary').textContent = 'You are not a site admin.';
        $('fb-list').appendChild(el('p', 'fb-empty',
          'This page is only useful to the site administrator.'));
        return;
      }
      if (r.status === 401) { location = '/'; return; }
      if (!r.ok) { say('could not load feedback (' + r.status + ')', true); return; }
      var d = await r.json();
      state.items = Array.isArray(d.items) ? d.items : [];
      state.mailConfigured = d.mailConfigured;
      summarise();
      render();
    } catch (e) { say('could not reach the server', true); }
  }

  $('fb-unread-only').addEventListener('change', function (ev) {
    state.unreadOnly = ev.target.checked;
    render();
  });
  $('fb-digest-dry').addEventListener('click', function () { digest(true); });
  $('fb-digest-send').addEventListener('click', function () { digest(false); });

  load();
})();
</script>
<script src="/theme.js"></script>
</body>
</html>
