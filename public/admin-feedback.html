<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>hiccup — feedback</title>
<meta name="robots" content="noindex">
<script src="/boot-theme.js"></script>
<script src="/boot-lang.js"></script>
<script src="/i18n.js"></script>
<link rel="icon" href="/brand/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/hiccup.css">
<link rel="stylesheet" href="/app.css">
<style>
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar-spacer { flex: 1 1 auto; }
  .logo { font-size: 20px; font-weight: 700; color: var(--text); }
  .logo:hover { text-decoration: none; }
  .logo-bump { position: relative; top: -3px; display: inline-block; color: var(--accent); }
</style>
</head>
<!--
  hiccup — admin feedback viewer (ARCHITECTURE.md "Wave 6").

  The PAGE is served to any signed-in user; every /api/admin/* call it makes is
  separately gated by requireSiteAdmin() in server.js. So a non-admin who guesses
  this URL gets an empty shell and a 403, not a leak. The gate is the API's, not
  this file's — never rely on a page being "hidden" as an access control.
-->
<body>

<header class="topbar">
  <a class="logo" href="/app" aria-label="hiccup">hic<span class="logo-bump">c</span>up</a>
  <nav data-i18n-attrs="aria-label" class="topnav" aria-label="tools">
    <a data-i18n class="topnav-link" href="/app">workbench</a>
    <a class="topnav-link" href="/hmr">HMR</a>
    <a data-i18n class="topnav-link" href="/kb">guides</a>
    <a data-i18n class="topnav-link" href="/team">team</a>
  </nav>
  <span class="topbar-spacer"></span>
  <span data-lang-switcher></span>
  <button data-i18n-attrs="aria-label" class="btn theme-toggle icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">☀</button>
</header>

<main class="fb-admin">
  <div class="fb-admin-head">
    <div>
      <h1 data-i18n>Feedback</h1>
      <p data-i18n class="muted" id="fb-summary">loading…</p>
    </div>
  </div>

  <div class="fb-toolbar">
    <label data-i18n><input type="checkbox" id="fb-unread-only"> unread only</label>
    <span class="topbar-spacer"></span>
    <button data-i18n class="btn" id="fb-digest-dry" type="button">preview digest</button>
    <button data-i18n class="btn" id="fb-digest-send" type="button">send digest now</button>
  </div>

  <p id="fb-msg" class="feedback-msg" role="status" aria-live="polite"></p>
  <div id="fb-list"></div>
</main>

<script src="/admin-feedback.js"></script>
<script src="/theme.js"></script>
</body>
</html>
