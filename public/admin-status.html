<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>hiccup — status</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('hiccup-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- Language, resolved before any markup is parsed — same FOUC-safe shape as the
     theme line above, and for a stronger reason: _t() and its catalogue must both
     exist before app.js's first render. document.write gives a blocking load with
     no fetch race and no build step. -->
<script>(function(){try{var L=localStorage.getItem('hiccup-lang');if(!/^(en|fr|es|de)$/.test(L||''))L=String(navigator.language||'en').slice(0,2).toLowerCase();if(!/^(en|fr|es|de)$/.test(L))L='en';document.documentElement.lang=L;if(L!=='en')document.write('<script src="/i18n/'+L+'.js"><\/script>');}catch(e){}})();</script>
<script src="/i18n.js"></script>
<link rel="icon" href="/brand/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/hiccup.css">
<link rel="stylesheet" href="/app.css">
<style>
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar-spacer { flex: 1 1 auto; }
  .logo { font-size: 20px; font-weight: 700; color: var(--text); }
  .logo:hover { text-decoration: none; }
  .logo-bump { position: relative; top: -3px; display: inline-block; color: var(--accent); }

  .st-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .st-card { padding: 12px 14px; }
  .st-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
  .st-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 13px; }
  .st-row dt { color: var(--muted); }
  .st-row dd { margin: 0; text-align: right; word-break: break-word; }
  .st-ok { color: var(--ok); font-weight: 600; }
  .st-bad { color: var(--crit); font-weight: 600; }
  .st-warn { color: var(--warn); font-weight: 600; }

  .st-users-card { margin-top: 16px; padding: 12px 14px; }
  .st-users-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 4px; }
  .st-users-lede { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .st-users-wrap { overflow-x: auto; }
  table.st-users-table { min-width: 640px; width: 100%; }
  table.st-users-table td { vertical-align: top; }
  .st-you { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
  .st-superuser-yes { color: var(--accent); font-weight: 600; }
  .st-superuser-no { color: var(--muted); }
  .st-users-msg { margin: 8px 0 0; font-size: 13px; color: var(--muted); min-height: 18px; }
  .st-users-msg.err { color: var(--crit); }
</style>
</head>
<!--
  hiccup — admin status (ARCHITECTURE.md "Wave 6").

  Same gating story as admin-feedback.html: the PAGE is static and served to any
  signed-in user; GET /api/admin/status is what is actually gated, by
  requireSiteAdmin() → config.adminEmails. Never treat an unlinked URL as access
  control.

  The API reports "configured"/"not configured" for secrets rather than values,
  so a screenshot of this page is not a credential leak.
-->
<body>

<header class="topbar">
  <a class="logo" href="/app" aria-label="hiccup">hic<span class="logo-bump">c</span>up</a>
  <nav data-i18n-attrs="aria-label" class="topnav" aria-label="tools">
    <a data-i18n class="topnav-link" href="/app">workbench</a>
    <a class="topnav-link" href="/hmr">HMR</a>
    <a data-i18n class="topnav-link" href="/kb">guides</a>
    <a data-i18n class="topnav-link" href="/team">team</a>
    <a data-i18n class="topnav-link is-current" href="/admin/status" aria-current="page">status</a>
    <a data-i18n class="topnav-link" href="/admin/feedback">feedback</a>
  </nav>
  <span class="topbar-spacer"></span>
  <button data-i18n data-i18n-attrs="title" class="btn" id="st-restart" type="button" title="Restart the hiccup service so it picks up new code">restart server</button>
  <button data-i18n class="btn" id="st-refresh" type="button">refresh</button>
  <span data-lang-switcher></span>
  <button data-i18n-attrs="aria-label" class="btn theme-toggle icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">☀</button>
</header>

<main class="fb-admin">
  <div class="fb-admin-head">
    <div>
      <h1 data-i18n>Status</h1>
      <p data-i18n class="muted" id="st-summary">loading…</p>
    </div>
  </div>
  <p id="st-msg" class="feedback-msg" role="status" aria-live="polite"></p>
  <div id="st-body" class="st-grid"></div>

  <section class="card st-users-card">
    <h2 data-i18n>Users</h2>
    <p data-i18n class="st-users-lede">Grant or revoke superuser access. Superusers can see this page,
      restart the service, and manage other users.</p>
    <div id="st-users" class="st-users-wrap"></div>
    <p id="st-users-msg" class="st-users-msg" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(title, rows) {
    var c = el('section', 'card st-card');
    c.appendChild(el('h2', null, title));
    var dl = el('dl');
    rows.forEach(function (r) {
      if (r[1] == null) return;
      var row = el('div', 'st-row');
      row.appendChild(el('dt', null, r[0]));
      var dd = el('dd', r[2] || null, String(r[1]));
      row.appendChild(dd);
      dl.appendChild(row);
    });
    c.appendChild(dl);
    return c;
  }

  function dur(s) {
    if (s == null) return null;
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    if (d) return d + 'd ' + h + 'h';
    if (h) return h + 'h ' + m + 'm';
    return m + 'm';
  }

  function render(s) {
    var host = $('st-body');
    host.textContent = '';

    $('st-summary').textContent = 'hiccup v' + s.version + ' · up ' + dur(s.uptimeSeconds) +
      ' · signed in as ' + (s.you && s.you.email);

    host.appendChild(card('Process', [
      ['version', s.version],
      ['node', s.node],
      ['platform', s.platform],
      ['pid', s.pid],
      ['uptime', dur(s.uptimeSeconds)],
      ['memory', s.memoryMb + ' MB'],
      ['analysis engine', s.engine && s.engine.analysis ? 'loaded' : 'MISSING',
        s.engine && s.engine.analysis ? 'st-ok' : 'st-bad']
    ]));

    var llm = s.llm || {};
    host.appendChild(card('LLM', [
      ['state', llm.state || llm.status || 'unknown'],
      ['model', llm.model || null],
      ['reachable', llm.ok === undefined ? null : (llm.ok ? 'yes' : 'no'),
        llm.ok ? 'st-ok' : 'st-bad'],
      ['note', llm.note || llm.detail || null]
    ]));

    host.appendChild(card('Data', [
      ['users', s.users],
      ['capture accounts', s.captures && s.captures.accounts],
      ['captures', s.captures && s.captures.total],
      ['disk used', s.disk ? (s.disk.mb + ' MB') : null],
      ['files', s.disk && s.disk.files],
      ['data dir', s.dataDir]
    ]));

    var f = s.feedback || {};
    host.appendChild(card('Feedback', [
      ['total', f.total],
      ['unread', f.unread, f.unread ? 'st-warn' : null],
      ['last 7 days', f.last7d],
      ['digest due now', f.dueNow === undefined ? null : (f.dueNow ? 'yes' : 'no')],
      ['digest last sent', (f.digest && f.digest.lastSentWeek) || 'never'],
      ['mail', s.mail && s.mail.configured ? 'configured' : 'NOT configured',
        s.mail && s.mail.configured ? 'st-ok' : 'st-warn']
    ]));

    var c = s.config || {};
    host.appendChild(card('Config', [
      ['baseUrl', c.baseUrl],
      ['listen', c.host + ':' + c.port],
      ['max upload', c.maxUploadMb + ' MB'],
      ['google sign-in', c.googleSignIn,
        c.googleSignIn === 'configured' ? 'st-ok' : null],
      ['digest recipient', c.digestRecipient || 'none', c.digestRecipient ? null : 'st-warn'],
      ['admins', (c.adminEmails || []).join(', ') || 'first user only']
    ]));

    host.appendChild(card('Models (preferred order)',
      (c.preferredModels || []).map(function (m, i) { return [String(i + 1), m]; })));
  }

  async function load() {
    $('st-msg').textContent = '';
    try {
      var r = await fetch('/api/admin/status', { cache: 'no-store' });
      if (r.status === 401) { location = '/'; return; }
      if (r.status === 403) {
        $('st-summary').textContent = 'You are not a site admin.';
        $('st-msg').textContent = 'This page is only useful to the site administrator.';
        return;
      }
      if (!r.ok) {
        $('st-msg').textContent = 'could not load status (' + r.status + ')';
        $('st-msg').className = 'feedback-msg is-err';
        return;
      }
      render(await r.json());
      loadUsers();
    } catch (e) {
      $('st-msg').textContent = 'could not reach the server';
      $('st-msg').className = 'feedback-msg is-err';
    }
  }

  // ------------------------------------------------------------------ users

  function usersMsg(text, isErr) {
    var m = $('st-users-msg');
    m.textContent = text || '';
    m.classList.toggle('err', !!isErr);
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function renderUsers(list) {
    var host = $('st-users');
    host.textContent = '';
    if (!list.length) {
      host.appendChild(el('p', 'muted', 'No user accounts yet.'));
      return;
    }

    var table = el('table', 'table-dense st-users-table');
    var thead = el('thead');
    var hrow = el('tr');
    ['Email', 'Name', 'Team role', 'Created', 'Last login', 'Superuser', ''].forEach(function (h) {
      hrow.appendChild(el('th', null, h));
    });
    thead.appendChild(hrow);
    table.appendChild(thead);

    var tbody = el('tbody');
    list.forEach(function (u) {
      var row = el('tr');

      var tdEmail = el('td', null, u.email);
      if (u.isYou) tdEmail.appendChild(el('span', 'st-you', '(you)'));
      row.appendChild(tdEmail);

      row.appendChild(el('td', null, u.name || '—'));
      row.appendChild(el('td', 'muted', (u.team && u.team.role) || '—'));
      row.appendChild(el('td', 'muted', fmtDate(u.createdAt)));
      row.appendChild(el('td', 'muted', fmtDate(u.lastLoginAt)));
      row.appendChild(el('td', u.isSuperuser ? 'st-superuser-yes' : 'st-superuser-no',
        u.isSuperuser ? 'yes' : 'no'));

      var tdAction = el('td');
      var btn = el('button', 'btn', u.isSuperuser ? 'Revoke superuser' : 'Make superuser');
      btn.type = 'button';
      btn.addEventListener('click', function () { toggleSuperuser(u, btn); });
      tdAction.appendChild(btn);
      row.appendChild(tdAction);

      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    host.appendChild(table);
  }

  async function toggleSuperuser(u, btn) {
    var wantSuperuser = !u.isSuperuser;
    var question = wantSuperuser
      ? ('Make "' + u.email + '" a superuser? They will be able to see this page, restart ' +
         'the service, and manage other users.')
      : ('Revoke superuser access for "' + u.email + '"?');
    if (!confirm(question)) return;

    btn.disabled = true;
    usersMsg(wantSuperuser ? 'Granting…' : 'Revoking…');
    try {
      var r = await fetch('/api/admin/users/' + encodeURIComponent(u.id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ superuser: wantSuperuser })
      });
      var d = null;
      try { d = await r.json(); } catch (e2) { /* non-json */ }
      if (!r.ok) {
        usersMsg((d && d.error) || ('request failed (' + r.status + ')'), true);
        btn.disabled = false;
        return;
      }
      usersMsg(wantSuperuser
        ? ('"' + u.email + '" is now a superuser.')
        : ('Superuser access revoked for "' + u.email + '".'));
      loadUsers();
    } catch (e) {
      usersMsg('could not reach the server', true);
      btn.disabled = false;
    }
  }

  async function loadUsers() {
    try {
      var r = await fetch('/api/admin/users', { cache: 'no-store' });
      if (r.status === 401) { location = '/'; return; }
      if (r.status === 403) { return; } // not a site admin — the main card already said so
      if (!r.ok) { usersMsg('could not load users (' + r.status + ')', true); return; }
      var d = await r.json();
      renderUsers(Array.isArray(d.users) ? d.users : []);
    } catch (e) {
      usersMsg('could not reach the server', true);
    }
  }

  // Restart is destructive-ish and easy to hit by accident next to refresh,
  // so it confirms first and then polls until the new process answers —
  // otherwise the page just sits on a dead socket looking broken.
  $('st-restart').addEventListener('click', async function () {
    if (!confirm(_t('Restart the hiccup service now?\n\nIn-flight requests are dropped and the app is unreachable for a few seconds.'))) return;
    $('st-restart').disabled = true;
    say('asking the server to restart…');
    try {
      var r = await fetch('/api/admin/server/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'restart' })
      });
      var d = await r.json();
      if (!r.ok) {
        say(d.error || ('restart refused (' + r.status + ')'), true);
        $('st-restart').disabled = false;
        return;
      }
      say(d.msg || "restarting…");
      waitForServer(0);
    } catch (e) {
      say('could not reach the server', true);
      $('st-restart').disabled = false;
    }
  });

  /** Poll /api/status until the relaunched process answers, then reload. */
  function waitForServer(attempt) {
    if (attempt > 30) {
      say('the server has not come back after ~30s — check the service', true);
      $('st-restart').disabled = false;
      return;
    }
    setTimeout(function () {
      fetch('/api/status', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (s) {
          // A LOW uptime is the proof it actually restarted; the old process
          // answering on its way out would report a high one.
          if (s && typeof s.uptime === "number" && s.uptime < 60) { location.reload(); return; }
          waitForServer(attempt + 1);
        })
        .catch(function () { waitForServer(attempt + 1); });
    }, 1000);
  }
  $('st-refresh').addEventListener('click', load);
  load();
})();
</script>
<script src="/theme.js"></script>
</body>
</html>
