<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>hiccup — status</title>
<meta name="robots" content="noindex">
<script src="/boot-theme.js"></script>
<script src="/boot-lang.js"></script>
<script src="/i18n.js"></script>
<link rel="icon" href="/brand/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/hiccup.css">
<link rel="stylesheet" href="/app.css">
<style>
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar-spacer { flex: 1 1 auto; }
  .logo { font-size: 20px; font-weight: 700; color: var(--text); }
  .logo:hover { text-decoration: none; }
  .logo-bump { position: relative; top: -3px; display: inline-block; color: var(--accent); }

  .st-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .st-card { padding: 12px 14px; }
  .st-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
  .st-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 13px; }
  .st-row dt { color: var(--muted); }
  .st-row dd { margin: 0; text-align: right; word-break: break-word; }
  .st-ok { color: var(--ok); font-weight: 600; }
  .st-bad { color: var(--crit); font-weight: 600; }
  .st-warn { color: var(--warn); font-weight: 600; }

  .st-users-card { margin-top: 16px; padding: 12px 14px; }
  .st-users-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 4px; }
  .st-users-lede { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .st-users-wrap { overflow-x: auto; }
  table.st-users-table { min-width: 640px; width: 100%; }
  table.st-users-table td { vertical-align: top; }
  .st-you { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
  .st-superuser-yes { color: var(--accent); font-weight: 600; }
  .st-superuser-no { color: var(--muted); }
  .st-users-msg { margin: 8px 0 0; font-size: 13px; color: var(--muted); min-height: 18px; }
  .st-users-msg.err { color: var(--crit); }
  table.st-users-table td:last-child { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<!--
  hiccup — admin status (ARCHITECTURE.md "Wave 6").

  Same gating story as admin-feedback.html: the PAGE is static and served to any
  signed-in user; GET /api/admin/status is what is actually gated, by
  requireSiteAdmin() → config.adminEmails. Never treat an unlinked URL as access
  control.

  The API reports "configured"/"not configured" for secrets rather than values,
  so a screenshot of this page is not a credential leak.
-->
<body>

<header class="topbar">
  <a class="logo" href="/app" aria-label="hiccup">hic<span class="logo-bump">c</span>up</a>
  <nav data-i18n-attrs="aria-label" class="topnav" aria-label="tools">
    <a data-i18n class="topnav-link" href="/app">workbench</a>
    <a class="topnav-link" href="/hmr">HMR</a>
    <a data-i18n class="topnav-link" href="/kb">guides</a>
    <a data-i18n class="topnav-link" href="/team">team</a>
    <a data-i18n class="topnav-link is-current" href="/admin/status" aria-current="page">status</a>
    <a data-i18n class="topnav-link" href="/admin/feedback">feedback</a>
  </nav>
  <span class="topbar-spacer"></span>
  <button data-i18n data-i18n-attrs="title" class="btn" id="st-restart" type="button" title="Restart the hiccup service so it picks up new code">restart server</button>
  <button data-i18n class="btn" id="st-refresh" type="button">refresh</button>
  <span data-lang-switcher></span>
  <button data-i18n-attrs="aria-label" class="btn theme-toggle icon-btn" type="button" data-theme-toggle aria-label="Toggle theme">☀</button>
</header>

<main class="fb-admin">
  <div class="fb-admin-head">
    <div>
      <h1 data-i18n>Status</h1>
      <p data-i18n class="muted" id="st-summary">loading…</p>
    </div>
  </div>
  <p id="st-msg" class="feedback-msg" role="status" aria-live="polite"></p>
  <div id="st-body" class="st-grid"></div>

  <section class="card st-users-card">
    <h2 data-i18n>Users</h2>
    <p data-i18n class="st-users-lede">Grant or revoke superuser access. Superusers can see this page,
      restart the service, and manage other users.</p>
    <div id="st-users" class="st-users-wrap"></div>
    <p id="st-users-msg" class="st-users-msg" role="status" aria-live="polite"></p>
  </section>
</main>

<script src="/admin-status.js"></script>
<script src="/theme.js"></script>
</body>
</html>
